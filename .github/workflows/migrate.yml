name: Database Migration

on:
  push:
    branches: [main]
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check migration secrets
        id: migration_secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$DIRECT_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Prisma migrations because DATABASE_URL or DIRECT_URL is not configured."
          fi
      - name: Deploy Prisma migrations
        if: steps.migration_secrets.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +e
          npx prisma migrate deploy 2>&1 | tee migrate-deploy.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if ! grep -q "P3005" migrate-deploy.log; then
            exit "$status"
          fi

          echo "::warning::Database is non-empty without Prisma migration history. Baselining existing migrations, then rerunning deploy."
          for migration in prisma/migrations/*; do
            if [ -d "$migration" ]; then
              npx prisma migrate resolve --applied "$(basename "$migration")"
            fi
          done

          npx prisma migrate deploy
